apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-kit-api.fullname" . }}-secret
  labels:
    {{- include "claude-kit-api.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | b64enc | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.GITHUB_CLIENT_ID | b64enc | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.GITHUB_CLIENT_SECRET | b64enc | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.GOOGLE_CLIENT_ID | b64enc | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.GOOGLE_CLIENT_SECRET | b64enc | quote }}
