name: pr-autofix

# Triggers when fast-validate completes on any branch.
# Gate job always runs (success/failure) so the workflow_run event never
# produces "0 jobs" which GitHub would count as a failure.
# Autofix job only proceeds when fast-validate actually failed on a PR branch.

on:
  workflow_run:
    workflows: ["fast-validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  gate:
    runs-on: self-hosted
    outputs:
      should_fix: ${{ steps.check.outputs.should_fix }}
      pr_number: ${{ steps.find_pr.outputs.pr_number }}
      attempts: ${{ steps.find_pr.outputs.attempts }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$CONCLUSION" = "failure" ] && [ "$BRANCH" != "main" ]; then
            echo "should_fix=true" >> "$GITHUB_OUTPUT"
            echo "Trigger condition met: fast-validate failed on branch $BRANCH"
          else
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            echo "No action needed: conclusion=$CONCLUSION branch=$BRANCH"
          fi

      - name: Find PR and count attempts
        id: find_pr
        if: steps.check.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number,labels \
            --jq '.[0]')

          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR found for branch $BRANCH — skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "attempts=99" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR" | python3 -c "import json,sys; print(json.load(sys.stdin)['number'])")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          ATTEMPTS=$(echo "$PR" | python3 -c "
          import json, sys
          labels = [l['name'] for l in json.load(sys.stdin).get('labels', [])]
          count = sum(1 for l in labels if l.startswith('autofix-attempt-'))
          print(count)
          ")
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER — autofix attempts so far: $ATTEMPTS"

  autofix:
    needs: gate
    if: >
      needs.gate.outputs.should_fix == 'true' &&
      needs.gate.outputs.pr_number != '' &&
      needs.gate.outputs.attempts < 3
    runs-on: self-hosted
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          submodules: true

      - name: Refresh tag cache
        run: git fetch --tags --force

      - name: Get failure logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log \
            > /tmp/ci-failure-logs.txt 2>&1 || true

          # Keep only the relevant failure section (last 200 lines)
          tail -200 /tmp/ci-failure-logs.txt > /tmp/ci-failure-trimmed.txt

          echo "Failure log collected ($(wc -l < /tmp/ci-failure-trimmed.txt) lines)"
          cat /tmp/ci-failure-trimmed.txt

      - name: Claude auto-fix
        id: fix
        run: |
          git config user.name "Mateo Segura"
          git config user.email "mateo.segura413@gmail.com"

          python3 scripts/build-autofix-prompt.py /tmp/ci-failure-trimmed.txt > /tmp/autofix-prompt.txt

          unset CLAUDECODE
          claude -p \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash" \
            < /tmp/autofix-prompt.txt > /tmp/autofix-result.txt 2>&1
          cat /tmp/autofix-result.txt

          if git diff --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            echo "No changes needed — the issue may be transient."
          else
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fix and label PR
        if: steps.fix.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          ATTEMPT: ${{ needs.gate.outputs.attempts }}
        run: |
          NEXT=$(( ATTEMPT + 1 ))
          SUMMARY=$(grep -A1 "FIXES_COMPLETE" /tmp/autofix-result.txt | tail -1 || echo "auto-fix attempt $NEXT")

          git add -A
          git commit -m "fix: $SUMMARY [autofix attempt $NEXT]"
          git push

          gh pr edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "autofix-attempt-$NEXT" 2>/dev/null || true

          echo "Fix committed and pushed. CI will re-run automatically."
          echo "Attempt $NEXT / 3 complete."

      - name: Comment if no fix found
        if: steps.fix.outputs.changes_made == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Auto-fix ran but made no changes. The CI failure may be transient — re-running manually may help. Check the [workflow logs](${{ github.event.workflow_run.html_url }}) for details."
