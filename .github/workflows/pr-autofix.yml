name: pr-autofix

# Triggers when fast-validate fails on a PR branch.
# Reads the failure logs, calls Claude to fix the issue, pushes a fix commit,
# and lets CI re-run. Stops after 3 attempts to prevent infinite loops.

on:
  workflow_run:
    workflows: ["fast-validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    # Only run when fast-validate failed, and not on main itself
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: self-hosted
    steps:
      - name: Find PR for this branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number,labels \
            --jq '.[0]')

          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR found for branch $BRANCH — skipping."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR" | python3 -c "import json,sys; print(json.load(sys.stdin)['number'])")
          echo "has_pr=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Count existing autofix attempts from labels
          ATTEMPTS=$(echo "$PR" | python3 -c "
          import json, sys
          labels = [l['name'] for l in json.load(sys.stdin).get('labels', [])]
          count = sum(1 for l in labels if l.startswith('autofix-attempt-'))
          print(count)
          ")
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER — autofix attempts so far: $ATTEMPTS"

      - name: Stop if max retries reached
        if: steps.pr.outputs.has_pr == 'true' && steps.pr.outputs.attempts >= 3
        run: |
          echo "Max autofix attempts (3) reached for PR #${{ steps.pr.outputs.pr_number }}. Stopping."
          exit 0

      - name: Checkout PR branch
        if: steps.pr.outputs.has_pr == 'true' && steps.pr.outputs.attempts < 3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Refresh tag cache
        if: steps.pr.outputs.has_pr == 'true' && steps.pr.outputs.attempts < 3
        run: git fetch --tags --force

      - name: Get failure logs
        if: steps.pr.outputs.has_pr == 'true' && steps.pr.outputs.attempts < 3
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log \
            > /tmp/ci-failure-logs.txt 2>&1 || true

          # Keep only the relevant failure section (last 200 lines of logs)
          tail -200 /tmp/ci-failure-logs.txt > /tmp/ci-failure-trimmed.txt

          echo "Failure log collected ($(wc -l < /tmp/ci-failure-trimmed.txt) lines)"
          cat /tmp/ci-failure-trimmed.txt

      - name: Claude auto-fix
        if: steps.pr.outputs.has_pr == 'true' && steps.pr.outputs.attempts < 3
        id: fix
        run: |
          git config user.name "Mateo Segura"
          git config user.email "mateo.segura413@gmail.com"

          # Build prompt via Python to avoid shell quoting issues
          python3 - <<'PYEOF'
          import pathlib
          logs = pathlib.Path("/tmp/ci-failure-trimmed.txt").read_text()
          prompt = f"""You are fixing CI failures in a Claude Code plugin repository.

The CI check "fast-validate" failed on this PR. It runs three checks:
1. Python syntax check: python3 -m py_compile claude-kit
2. CLI smoke tests: bash scripts/test-cli.sh
3. Tier 1 plugin validation: python3 scripts/validate-plugins.py --changed --json

Here are the failure logs:
---
{logs}
---

Fix the failing check(s) by editing the relevant files in the repository.
The repository root is: {pathlib.Path.cwd()}

Rules:
- Read any file before editing it
- Make only the minimal change needed to fix the specific failure
- Do not refactor or clean up unrelated code
- After fixing, output "FIXES_COMPLETE" followed by a one-line summary of what you changed
"""
          pathlib.Path("/tmp/autofix-prompt.txt").write_text(prompt)
          PYEOF

          unset CLAUDECODE
          claude -p \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash" \
            < /tmp/autofix-prompt.txt > /tmp/autofix-result.txt 2>&1
          cat /tmp/autofix-result.txt

          if git diff --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            echo "No changes needed — the issue may be transient."
          else
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fix and label PR
        if: >
          steps.pr.outputs.has_pr == 'true' &&
          steps.pr.outputs.attempts < 3 &&
          steps.fix.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ATTEMPT: ${{ steps.pr.outputs.attempts }}
        run: |
          NEXT=$(( ATTEMPT + 1 ))
          SUMMARY=$(grep -A1 "FIXES_COMPLETE" /tmp/autofix-result.txt | tail -1 || echo "auto-fix attempt $NEXT")

          git add -A
          git commit -m "fix: $SUMMARY [autofix attempt $NEXT]"
          git push

          # Add attempt label so we can track retry count
          gh pr edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "autofix-attempt-$NEXT" 2>/dev/null || true

          echo "Fix committed and pushed. CI will re-run automatically."
          echo "Attempt $NEXT / 3 complete."

      - name: Comment if no fix found
        if: >
          steps.pr.outputs.has_pr == 'true' &&
          steps.pr.outputs.attempts < 3 &&
          steps.fix.outputs.changes_made == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Auto-fix ran but made no changes. The CI failure may be transient — re-running manually may help. Check the [workflow logs](${{ github.event.workflow_run.html_url }}) for details."
