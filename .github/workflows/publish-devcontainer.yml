name: publish-devcontainer

# Rebuilds and pushes ghcr.io/mateosegura/dev-env-claude-kit:latest
# whenever the Dockerfile or this workflow file changes on main.

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/publish-devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mateosegura/dev-env-claude-kit:latest
          cache-from: type=registry,ref=ghcr.io/mateosegura/dev-env-claude-kit:cache
          cache-to: type=registry,ref=ghcr.io/mateosegura/dev-env-claude-kit:cache,mode=max
