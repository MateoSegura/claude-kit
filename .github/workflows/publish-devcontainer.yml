name: publish-devcontainer

# Rebuilds and pushes ghcr.io/mateosegura/dev-env-claude-kit:latest
# whenever the Dockerfile or this workflow file changes on main.

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/publish-devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker daemon (self-hosted runner)
        run: |
          sudo service docker start 2>/dev/null || sudo systemctl start docker 2>/dev/null || true
          timeout 30 sh -c 'until docker info > /dev/null 2>&1; do sleep 1; done'
          docker info

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ghcr.io/mateosegura/dev-env-claude-kit:latest \
            .devcontainer/

      - name: Push image
        run: docker push ghcr.io/mateosegura/dev-env-claude-kit:latest
