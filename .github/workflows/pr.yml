name: pr-validate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tier1:
    runs-on: self-hosted
    outputs:
      plugins_changed: ${{ steps.check.outputs.plugins_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if plugins changed
        id: check
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^plugins/' || true)
          if [ -n "$CHANGED" ]; then
            echo "plugins_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tier 1 — all plugins
        id: tier1
        run: python3 scripts/validate-plugins.py --all --json | tee /tmp/t1.json

      - name: Post Tier 1 comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/t1.json', 'utf8'));
              const { summary, results } = data;
              const rows = results.map(r => {
                const icon = r.status === 'pass' ? '✅' : r.status === 'warn' ? '⚠️' : '❌';
                const issues = r.findings.map(f => `- \`[${f.level}]\` ${f.message}`).join('\n');
                return `| ${icon} | \`${r.plugin}\` |\n${issues ? '| | ' + issues.replace(/\n/g, '\n| | ') + ' |' : ''}`;
              }).join('\n');
              body = `## 🔍 Tier 1 Validation\n\n` +
                `**${summary.passed}** passed · **${summary.warned}** warned · **${summary.failed}** failed\n\n` +
                `| Status | Plugin |\n|--------|--------|\n${rows}`;
            } catch (e) {
              body = `## 🔍 Tier 1 Validation\n\n❌ Could not parse results: ${e.message}`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 🔍 Tier 1 Validation'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
