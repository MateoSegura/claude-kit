name: pr-validate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tier1:
    runs-on: self-hosted
    outputs:
      plugins_changed: ${{ steps.check.outputs.plugins_changed }}
      changed_plugins: ${{ steps.list.outputs.changed_plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if plugins changed
        id: check
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^plugins/' || true)
          if [ -n "$CHANGED" ]; then
            echo "plugins_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed plugin names
        id: list
        run: |
          NAMES=$(git diff --name-only origin/main...HEAD \
            | grep '^plugins/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ')
          echo "changed_plugins=$NAMES" >> "$GITHUB_OUTPUT"

      - name: Tier 1 — all plugins
        id: tier1
        run: python3 scripts/validate-plugins.py --all --json | tee /tmp/t1.json

      - name: Upgrade safety check
        id: upgrade
        if: always()
        run: |
          git fetch --tags --force
          bash scripts/test-upgrade-safety.sh --from origin/main --to HEAD --ci --json \
            | tee /tmp/upgrade-safety.json

      - name: Post upgrade safety comment
        if: always() && steps.upgrade.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/upgrade-safety.json', 'utf8'));
              const { breaking_count, cautionary_count, safe_count } = data;
              const total = breaking_count + cautionary_count + safe_count;
              if (total === 0) {
                body = `## 🛡️ Upgrade Safety\n\nNo plugin API surface changes detected.`;
              } else {
                let rows = '';
                for (const item of data.breaking) {
                  rows += `| ❌ BREAKING | \`${item}\` |\n`;
                }
                for (const item of data.cautionary) {
                  rows += `| ⚠️ CAUTIONARY | \`${item}\` |\n`;
                }
                for (const item of data.safe) {
                  rows += `| ✅ SAFE | \`${item}\` |\n`;
                }
                body = `## 🛡️ Upgrade Safety\n\n` +
                  `**${breaking_count}** breaking · **${cautionary_count}** cautionary · **${safe_count}** safe\n\n` +
                  `| Level | Change |\n|-------|--------|\n${rows}`;
                if (breaking_count > 0) {
                  body += `\n> **⚠️ Breaking changes detected — this must be a MAJOR version bump.**`;
                }
              }
            } catch (e) {
              body = `## 🛡️ Upgrade Safety\n\n❌ Could not parse results: ${e.message}`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 🛡️ Upgrade Safety'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Post Tier 1 comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/t1.json', 'utf8'));
              const { summary, results } = data;
              const rows = results.map(r => {
                const icon = r.status === 'pass' ? '✅' : r.status === 'warn' ? '⚠️' : '❌';
                const issues = r.findings.map(f => `- \`[${f.level}]\` ${f.message}`).join('\n');
                return `| ${icon} | \`${r.plugin}\` |\n${issues ? '| | ' + issues.replace(/\n/g, '\n| | ') + ' |' : ''}`;
              }).join('\n');
              body = `## 🔍 Tier 1 Validation\n\n` +
                `**${summary.passed}** passed · **${summary.warned}** warned · **${summary.failed}** failed\n\n` +
                `| Status | Plugin |\n|--------|--------|\n${rows}`;
            } catch (e) {
              body = `## 🔍 Tier 1 Validation\n\n❌ Could not parse results: ${e.message}`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 🔍 Tier 1 Validation'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ── Lightweight Claude semantic check (haiku, <4 min) ──────────────────────
  # Runs on every PR. Only reviews CHANGED plugins.
  # Catches things deterministic checks miss: identity coherence, content depth,
  # domain specificity, cross-agent contradictions, hook appropriateness.
  # Informational only — never blocks merge.
  semantic-check:
    runs-on: self-hosted
    needs: validate-tier1
    if: needs.validate-tier1.outputs.plugins_changed == 'true'
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build review prompt
        id: prompt
        run: |
          python3 scripts/build-semantic-prompt.py \
            ${{ needs.validate-tier1.outputs.changed_plugins }} \
            > /tmp/semantic-prompt.txt
          echo "Prompt built for: ${{ needs.validate-tier1.outputs.changed_plugins }}"

      - name: Claude semantic review (haiku)
        id: review
        continue-on-error: true
        run: |
          unset CLAUDECODE
          cat /tmp/semantic-prompt.txt | claude -p \
            --model haiku \
            --allowedTools "Read,Glob,Grep" \
            > /tmp/semantic-review.md 2>&1
          cat /tmp/semantic-review.md

      - name: Post semantic review comment
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/semantic-review.md', 'utf8');
            } catch (e) {
              output = `Review did not produce output: ${e.message}`;
            }
            const body = `## 🧠 Semantic Check\n\n` +
              `_Claude Haiku review of changed plugins — informational only_\n\n` +
              output;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('## 🧠 Semantic Check'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
