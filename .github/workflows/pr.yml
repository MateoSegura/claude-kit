name: pr-validate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tier1:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Tier 1 — all plugins
        id: tier1
        run: python3 scripts/validate-plugins.py --all --json | tee /tmp/t1.json

      - name: Post Tier 1 comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/t1.json', 'utf8'));
              const { summary, results } = data;
              const rows = results.map(r => {
                const icon = r.status === 'pass' ? '✅' : r.status === 'warn' ? '⚠️' : '❌';
                const issues = r.findings.map(f => `- \`[${f.level}]\` ${f.message}`).join('\n');
                return `| ${icon} | \`${r.plugin}\` |\n${issues ? '| | ' + issues.replace(/\n/g, '\n| | ') + ' |' : ''}`;
              }).join('\n');
              body = `## 🔍 Tier 1 Validation\n\n` +
                `**${summary.passed}** passed · **${summary.warned}** warned · **${summary.failed}** failed\n\n` +
                `| Status | Plugin |\n|--------|--------|\n${rows}`;
            } catch (e) {
              body = `## 🔍 Tier 1 Validation\n\n❌ Could not parse results: ${e.message}`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 🔍 Tier 1 Validation'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  claude-validate:
    runs-on: self-hosted
    needs: validate-tier1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed plugins
        id: changed
        run: |
          PLUGINS=$(git diff --name-only origin/main...HEAD \
            | grep '^plugins/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "list=$PLUGINS" >> "$GITHUB_OUTPUT"

      - name: Claude Tier 2-4 review
        if: steps.changed.outputs.list != ''
        env:
          CHANGED_PLUGINS: ${{ steps.changed.outputs.list }}
        run: |
          # Unset CLAUDECODE so claude -p can run even from within a Claude Code session
          # Prompt via stdin avoids --plugin-dir consuming extra positional args
          unset CLAUDECODE
          PROMPT="Run /system-maker:validate on these plugins: ${CHANGED_PLUGINS}. Read the files directly from the repository. Output structured markdown with PASS/FAIL per plugin."
          echo "$PROMPT" | claude -p \
            --plugin-dir "${GITHUB_WORKSPACE}/plugins/system-maker" \
            > /tmp/claude-review.md
          cat /tmp/claude-review.md

      - name: Post Claude review comment
        if: steps.changed.outputs.list != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = '## 🤖 Semantic Validation (Tier 2-4)\n\n' +
                fs.readFileSync('/tmp/claude-review.md', 'utf8');
            } catch (e) {
              body = '## 🤖 Semantic Validation (Tier 2-4)\n\n❌ Review not available.';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 🤖 Semantic Validation'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: No changed plugins
        if: steps.changed.outputs.list == ''
        run: echo "No plugin changes detected — skipping semantic review."
