name: fast-validate

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

jobs:
  branch-name:
    runs-on: self-hosted
    # Only check on push (not PR) and skip main
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    steps:
      - name: Enforce branch naming convention
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          PATTERN="^(feat|fix|chore|docs|test|refactor|perf|ci|build|style|release|hotfix)/.+"
          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "Branch name OK: $BRANCH"
          else
            echo "ERROR: Branch '$BRANCH' does not follow naming convention."
            echo ""
            echo "Required pattern: <type>/<description>"
            echo "Valid types: feat, fix, chore, docs, test, refactor, perf, ci, build, style, release, hotfix"
            echo ""
            echo "Examples:"
            echo "  feat/add-new-agent"
            echo "  fix/hook-script-path"
            echo "  chore/bump-dependencies"
            echo "  release/v0.2.0"
            exit 1
          fi

  fast-validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh tag cache
        run: git fetch --tags --force

      - name: Python version
        run: python3 --version

      - name: Syntax check — claude-kit CLI
        run: python3 -m py_compile claude-kit && echo "Syntax OK"

      - name: CLI smoke tests
        run: bash scripts/test-cli.sh

      - name: Plugin consistency checks
        run: bash scripts/test-plugin-consistency.sh

      - name: Docs structure validation
        run: bash scripts/validate-docs.sh

      - name: Upgrade safety check
        if: github.ref != 'refs/heads/main'
        run: |
          bash scripts/test-upgrade-safety.sh --from HEAD~1 --to HEAD --ci --json | tee /tmp/upgrade-safety.json
          # Parse results for GitHub Actions annotations
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/upgrade-safety.json'))
          for item in data.get('breaking', []):
              print(f'::error::BREAKING: {item}')
          for item in data.get('cautionary', []):
              print(f'::warning::CAUTIONARY: {item}')
          if data['breaking_count'] > 0:
              print(f'::error::{data[\"breaking_count\"]} breaking change(s) detected')
              sys.exit(1)
          elif data['cautionary_count'] > 0:
              print(f'{data[\"cautionary_count\"]} cautionary change(s) — review before releasing')
          else:
              print('No API surface changes')
          "

      - name: Tier 1 — changed plugins
        run: python3 scripts/validate-plugins.py --changed --json

      - name: API syntax check
        run: python3 -m py_compile api/app/main.py && echo "API syntax OK"

      - name: API tests
        run: |
          cd api
          python3 -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
          .venv/bin/python -m pytest -v --tb=short
