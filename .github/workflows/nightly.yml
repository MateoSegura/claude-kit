name: nightly-plugin-review

# Runs every night at 02:00 UTC on main only.
# 1. Semantic review of all plugins on main.
# 2. If WARN or FATAL findings exist, Claude auto-fixes them, opens a fix
#    PR, and enables auto-merge. The PR auto-merges once fast-validate and
#    validate-tier1 pass. The following night confirms all issues are resolved.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review-and-fix:
    # Only run from main — ignore spurious triggers on feature branches
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh tag cache
        run: git fetch --tags --force

      - name: Semantic review — all plugins
        id: review
        continue-on-error: true
        run: |
          PROMPT="Run /system-maker:validate on ALL plugins in ${GITHUB_WORKSPACE}/plugins/. Read every plugin directory. Output structured markdown with PASS/FAIL/WARN per plugin and a numbered list of ALL findings (FATAL, WARN, NOTE) with the exact file path and issue for each."
          unset CLAUDECODE
          echo "$PROMPT" | claude -p \
            --plugin-dir "${GITHUB_WORKSPACE}/plugins/system-maker" \
            > /tmp/nightly-review.md 2>&1
          cat /tmp/nightly-review.md

          if grep -qE "WARN|PASS WITH NOTES" /tmp/nightly-review.md; then
            echo "issues_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "issues_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-fix WARN findings
        id: autofix
        if: steps.review.outputs.issues_found == 'true'
        run: |
          BRANCH="fix/nightly-plugin-review-$(date +%Y%m%d)"
          git config user.name "Mateo Segura"
          git config user.email "mateo.segura413@gmail.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          python3 scripts/build-nightly-prompt.py /tmp/nightly-review.md > /tmp/fix-prompt.txt

          unset CLAUDECODE
          claude -p \
            --allowedTools "Read,Edit,Write,Glob,Grep" \
            < /tmp/fix-prompt.txt > /tmp/autofix-output.md 2>&1
          cat /tmp/autofix-output.md

          if git diff --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open auto-fix PR
        if: steps.autofix.outputs.changes_made == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.autofix.outputs.branch }}"
          DATE=$(date +%Y-%m-%d)

          git add plugins/
          git commit -m "fix: resolve nightly plugin review findings ($DATE)"
          git push -u origin "$BRANCH"

          FIXES=$(grep -A 50 '## Fixes Applied' /tmp/autofix-output.md || echo 'See workflow run for fix details.')
          PREVIEW=$(head -80 /tmp/nightly-review.md)
          BODY="Auto-generated by nightly semantic review. Merges automatically once fast-validate and validate-tier1 pass.

## Review Findings

$PREVIEW

$FIXES"

          PR_URL=$(gh pr create \
            --title "fix: resolve nightly plugin review findings ($DATE)" \
            --body "$BODY")

          gh pr merge "$PR_URL" --auto --squash
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Fix PR: $PR_URL"

      - name: Write workflow summary
        if: always()
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "## Nightly Plugin Review — $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/nightly-review.md ]; then
            cat /tmp/nightly-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Review did not produce output." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.review.outputs.issues_found }}" = "true" ]; then
            if [ "${{ steps.autofix.outputs.changes_made }}" = "true" ]; then
              echo "**Auto-fix PR:** ${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Auto-fix ran but made no file changes.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "**All plugins clean — no actionable issues found.**" >> "$GITHUB_STEP_SUMMARY"
          fi
