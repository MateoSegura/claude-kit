name: "Smoke test — basic prompt and response"
description: "Send a simple prompt and verify the response contains expected text"
model: "claude-sonnet-4-20250514"
max_tokens: 1024
plugins: []

turns:
  - role: user
    content: "What is the capital of France? Answer in one sentence."
  - role: expected
    contains:
      - "Paris"
    max_tokens: 100

validations:
  - type: response_contains
    value: "Paris"
  - type: no_error
